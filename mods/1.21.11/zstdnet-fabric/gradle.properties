org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=zstdnet
mod_name=ZstdNet
mod_version=1.4.2-m2.9
mod_group_id=cn.tohsaka.factory

minecraft_version=1.21.11
loader_version=0.19.3
# fabric.mod.json 里对玩家声明的 loader 下限，与编译用的 loader_version 分开：
# 本变体只用到 FabricLoader.getConfigDir()/getEnvironmentType() 这类上古 API，
# 直接把编译版本写成下限会把仍在用 0.17/0.18 的整合包挡在门外（报 requires fabricloader >=0.19.3）。
# 取 0.17.3 = fabric-api 0.141.5+1.21.11 自身声明的下限，低于它反正装不上 API。
loader_min_version=0.17.3
fabric_api_version=0.141.5+1.21.11
# 1.21.11 仍是混淆版本（非混淆自 26.1 起）→ 需 mappings，故 Loom 只能用 1.15.x 线
# （1.16+ 是非混淆专用线，会把 1.21.11 误判为非混淆并拒绝 mappings）。
loom_version=1.15.5
