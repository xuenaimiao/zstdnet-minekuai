org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=zstdnet
mod_name=ZstdNet
mod_version=1.4.2-m2.9
mod_group_id=cn.tohsaka.factory

# Velocity 代理端插件（服务端专用，不涉及 MC 加载器）。
# 针对 velocity-api 3.4.0 编译（其字节码为 Java 17）、产出 Java 17 字节码——同一个 jar 即可在
# Velocity 3.4/3.5（JDK 21）与 Velocity 4.x（JDK 25）上加载（API 为增量演进，4.x 未删改本插件用到的类）。
velocity_api_version=3.4.0
zstd_version=1.5.7-7
# netty 由 Velocity 自带（3.5.1 为 4.2.15，4.2.x 为 4.2.18），仅编译期依赖、不打包；只用 4.1/4.2 全系稳定的 API。
netty_version=4.2.15.Final
