org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=zstdnet
mod_name=ZstdNet
mod_version=1.4.2-m2.8
mod_group_id=cn.tohsaka.factory

minecraft_version=26.3
loader_version=0.19.5
# fabric.mod.json 里对玩家声明的 loader 下限，与编译用的 loader_version 分开（同 1.21.11 变体的做法）。
# 取 0.19.3 = fabric-api 0.161.0+26.3 自身声明的下限，低于它反正装不上 API。
# ★ 另一个原因：Fabric Loader 按本 mod 声明的 fabricloader 下限给 mixin 配置定 fabric-compat 等级，
#   下限 >=0.19.4 即升到 Mixin 0.17.4 行为——required 配置里任何找不到的 @Mixin 目标直接抛错、专用服起不来。
#   （客户端专属 mixin 已全部放进 "client" 段，本身不再踩这个坑；这里保持下限与 fabric-api 一致即可。）
loader_min_version=0.19.3
fabric_api_version=0.161.0+26.3
# 26.1 起 Minecraft 非混淆：新版 Loom（不再重映射）+ Gradle 9.4.1 + JDK 25。1.16.3 沿用 26.1 验证过的版本。
loom_version=1.16.3
